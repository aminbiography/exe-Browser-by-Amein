name: Build aminbiography Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build branded executable
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "aminbiography" --collect-all PySide6 main.py

      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v4
        with:
          name: aminbiography-windows-x64
          path: dist/aminbiography/
          if-no-files-found: error
          retention-days: 30
